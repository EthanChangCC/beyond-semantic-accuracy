### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

### Dataset
dataset: atc_task1_train
eval_dataset: atc_task1_val
dataset_dir: /root/autodl-tmp/data
template: qwen3
cutoff_len: 8192
max_samples: 2035
overwrite_cache: true
preprocessing_num_workers: 4

### Output
output_dir: /root/autodl-tmp/output/qwen3-8b-atc-lora
logging_steps: 20
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

### Train
